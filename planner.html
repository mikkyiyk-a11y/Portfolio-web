        <p>Add your assignments and study tasks here.</p>

    <!-- =====================================================
         ACADEMIC PLANNER SECTION
          "Academic Planner Page"
          "Interactive task management system"
           The add-task form

         All the working parts are in js/planner.js
         - Add tasks          -> the form below
         - Mark as completed  -> the checkbox on each task
         - Delete tasks       -> the Delete button on each task
         ===================================================== -->
    <section class="section">
      <div class="container planner">
        <div class="card">

          <!-- The form to ADD a task -->
          <form class="task-form" id="taskForm">
            <input type="text" id="taskInput" placeholder="Start a task.">
            <input type="date" id="taskDate">
            <button type="submit" class="btn">Add Task</button>
          </form>

          <!-- Error message if the box is empty (planner.js fills it in) -->
          <span class="error" id="taskError"></span>

          <!--"Dynamic content updates"
               This line changes every time you add, tick or delete a task -->
          <p class="task-count" id="taskCount">You have 0 tasks</p>

          <!--Task "Lists"
               This list starts EMPTY. With planner.js I creates a new <li>
               inside it for every task you add. -->
          <ul id="taskList"></ul>

        </div>
      </div>
    </section>
